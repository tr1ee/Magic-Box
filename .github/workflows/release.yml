name: Model-free desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/public-package.test.mjs test/macos-package.test.mjs test/file-transfer-network.test.mjs test/transfer-integrity.test.mjs test/mobile-transfer.test.mjs
      - run: npm run desktop:installer:basic
      - run: node scripts/smoke-basic-package.mjs release/windows-basic/MagicBox
      - name: SHA-256
        shell: pwsh
        run: |
          Get-ChildItem release/installer/*-basic.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii ($_.FullName + '.sha256')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-basic
          path: |
            release/installer/*-basic.exe
            release/installer/*-basic.exe.sha256
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify DMG
        run: bash Build-Mac.command
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-basic
          path: |
            release/macos/*-basic.dmg
            release/macos/*-basic.dmg.sha256
            release/macos/*-basic.dmg.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Magic Box $GITHUB_REF_NAME · 基础版" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
